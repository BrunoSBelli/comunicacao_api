name: PR Workflow

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Baixa o código do repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # Instala o JDK 21 e já cuida do cache do Maven
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven   # substitui o passo manual de cache

      # Compila, roda os testes e empacota
      - name: Build and test with Maven
        run: mvn -B verify
